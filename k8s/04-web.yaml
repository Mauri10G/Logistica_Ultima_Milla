apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: logistica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: logistica-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
# En Docker Desktop un Service LoadBalancer queda publicado en localhost.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: logistica
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8082
      targetPort: 80
