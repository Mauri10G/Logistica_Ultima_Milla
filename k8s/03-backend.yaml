apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: logistica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: logistica-backend:latest
          imagePullPolicy: IfNotPresent # usa la imagen construida en Docker Desktop
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_URL
              value: jdbc:postgresql://postgis:5432/logistica
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: logistica-db, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: logistica-db, key: DB_PASSWORD }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36 # hasta 3 minutos para arrancar
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: logistica
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
