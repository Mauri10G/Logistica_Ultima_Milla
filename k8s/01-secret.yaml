# Credenciales de la base. En un cluster real no se suben al repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: logistica-db
  namespace: logistica
type: Opaque
stringData:
  DB_USER: logistica
  DB_PASSWORD: logistica
---
# Clave de firma de los tokens JWT (minimo 32 caracteres). Es solo para la demostracion local con el login encendido:
# en un cluster real se crea fuera del repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: logistica-jwt
  namespace: logistica
type: Opaque
stringData:
  JWT_SECRETO: demo-local-logistica-jwt-clave-de-32-caracteres-o-mas
