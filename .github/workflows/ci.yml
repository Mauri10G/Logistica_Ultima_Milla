name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # mvnw baja la distribución de Maven de Maven Central (~/.m2/wrapper). Se guarda en caché para no depender de la red
      - name: Caché del wrapper de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      # Si Maven Central falla al bajar la distribución (corte de red), se reintenta antes de correr las pruebas
      - name: Preparar Maven (con reintentos)
        run: |
          for intento in 1 2 3 4; do
            if ./mvnw -B --version; then exit 0; fi
            echo "mvnw no pudo preparar Maven (intento $intento de 4), reintento en $((intento * 15)) s"
            sleep $((intento * 15))
          done
          echo "No se pudo descargar Maven después de 4 intentos"
          exit 1
      # ubuntu-latest trae Docker: Testcontainers levanta postgis/postgis:16-3.4 para las pruebas *IT
      - name: Unitarias + integración + cobertura
        run: ./mvnw -B verify
      - name: Reporte de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reportes
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Móvil (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Misma versión de Flutter que usa el equipo (pubspec.yaml pide Dart ^3.13.3)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  # Despliegue continuo: cada push a develop con las pruebas en verde publica las imágenes en GitHub Container Registry.
  # La VM de Azure las baja sola (implantacion/nube/actualizar.sh). Nunca corre en pull requests.
  publicar:
    name: Publicar imágenes (GHCR)
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR exige nombres en minúsculas
      - name: Nombres de las imágenes
        id: nombres
        run: |
          dueno="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "backend=ghcr.io/${dueno}/logistica-backend"
            echo "web=ghcr.io/${dueno}/logistica-web"
            echo "sha=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.nombres.outputs.backend }}:develop
            ${{ steps.nombres.outputs.backend }}:${{ steps.nombres.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: web
          push: true
          build-args: |
            VITE_API_URL=mismo-origen
            VITE_AUTH_HABILITADA=true
          tags: |
            ${{ steps.nombres.outputs.web }}:develop
            ${{ steps.nombres.outputs.web }}:${{ steps.nombres.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Rendimiento: levanta PostGIS y el backend con la seguridad encendida y corre la prueba de humo y una ronda corta de
  # concurrencia de k6. Falla si una ruta supera su maximo de pedidos o un pedido queda en dos rutas (requisito critico).
  rendimiento:
    name: Rendimiento (k6 smoke + concurrencia)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: logistica
          POSTGRES_USER: logistica
          POSTGRES_PASSWORD: logistica
        ports:
          - 5433:5432 # el mismo puerto que docker-compose y el perfil dev
        options: >-
          --health-cmd "pg_isready -U logistica -d logistica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Caché del wrapper de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - name: Compilar el backend (con reintentos)
        working-directory: backend
        run: |
          for intento in 1 2 3; do
            if ./mvnw -B -q -DskipTests package; then exit 0; fi
            echo "No se pudo compilar (intento $intento de 3), reintento en $((intento * 15)) s"
            sleep $((intento * 15))
          done
          exit 1
      - name: Levantar el backend con la seguridad encendida
        working-directory: backend
        env:
          SEGURIDAD_HABILITADA: 'true'
        run: |
          JAR=$(ls target/*.jar | grep -v plain | head -1)
          nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then echo "Backend arriba"; exit 0; fi
            sleep 2
          done
          echo "El backend no arranco en 2 minutos"; tail -50 "$GITHUB_WORKSPACE/backend.log"; exit 1
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
      - name: Prueba de humo (login y API)
        run: k6 run tests/performance/smoke.js
      # El runner es mas lento que un equipo de desarrollo: aqui se exige la regla, no la velocidad (P95_MAX_MS)
      - name: Concurrencia de pedidos de último momento
        run: >-
          k6 run -e PEDIDOS=150 -e USUARIOS=40 -e P95_MAX_MS=60000
          --summary-export=concurrencia-ci.json tests/performance/concurrencia.js
      - name: Resumen de k6 y log del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendimiento-reportes
          path: |
            concurrencia-ci.json
            backend.log
