name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # mvnw baja la distribución de Maven de Maven Central (~/.m2/wrapper). Se guarda en caché para no depender de la red
      - name: Caché del wrapper de Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      # Si Maven Central falla al bajar la distribución (corte de red), se reintenta antes de correr las pruebas
      - name: Preparar Maven (con reintentos)
        run: |
          for intento in 1 2 3 4; do
            if ./mvnw -B --version; then exit 0; fi
            echo "mvnw no pudo preparar Maven (intento $intento de 4), reintento en $((intento * 15)) s"
            sleep $((intento * 15))
          done
          echo "No se pudo descargar Maven después de 4 intentos"
          exit 1
      # ubuntu-latest trae Docker: Testcontainers levanta postgis/postgis:16-3.4 para las pruebas *IT
      - name: Unitarias + integración + cobertura
        run: ./mvnw -B verify
      - name: Reporte de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reportes
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Despliegue continuo: cada push a develop con las pruebas en verde publica las imágenes en GitHub Container Registry.
  # La VM de Azure las baja sola (implantacion/nube/actualizar.sh). Nunca corre en pull requests.
  publicar:
    name: Publicar imágenes (GHCR)
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR exige nombres en minúsculas
      - name: Nombres de las imágenes
        id: nombres
        run: |
          dueno="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "backend=ghcr.io/${dueno}/logistica-backend"
            echo "web=ghcr.io/${dueno}/logistica-web"
            echo "sha=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.nombres.outputs.backend }}:develop
            ${{ steps.nombres.outputs.backend }}:${{ steps.nombres.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            VITE_API_URL=mismo-origen
            VITE_AUTH_HABILITADA=true
          tags: |
            ${{ steps.nombres.outputs.web }}:develop
            ${{ steps.nombres.outputs.web }}:${{ steps.nombres.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
