# Análisis estático de la web con SonarQube (proyecto independiente del backend).
# El token NO va aquí: se pasa por variable de entorno SONAR_TOKEN o -Dsonar.token=...
#
#   cd web
#   npm run test:coverage        # genera coverage/lcov.info
#   npx @sonar/scan              # lee este archivo; token en SONAR_TOKEN
sonar.projectKey=logistica-web
sonar.projectName=logistica-web
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/__mocks__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.jsx,src/__mocks__/**,src/**/*.test.js,src/**/*.test.jsx
sonar.sourceEncoding=UTF-8
