spring:
  application:
    name: logistica
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # el esquema lo gestiona Flyway
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  # Respuestas JSON comprimidas con gzip si el cliente lo acepta (navegador, axios, k6, Flutter): el listado de rutas
  # de un dia de mucho volumen pesa ~2 MB en texto y ~10 veces menos comprimido (issue #31).
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Propiedades propias del sistema (ver LogisticaProperties)
logistica:
  zona-horaria: America/Guayaquil
  zonas:
    # Area minima (m2) de la interseccion de dos zonas para contar como superposicion. Absorbe las diferencias de
    # decimales al pegar el borde de una zona al de su vecina (la web pega los puntos a vertices y bordes).
    # Una zona totalmente dentro de otra se rechaza siempre. Se lee con @Value en ZonaService.
    tolerancia-superposicion-m2: 500
  pedidos:
    # Minutos minimos entre la hora actual del servidor (logistica.zona-horaria) y la fecha/hora de entrega de un
    # pedido, al registrar y al editar. Se lee con @Value en PedidoService.
    anticipacion-minima-minutos: 30
    # Fecha de entrega maxima: hoy + estos dias (422 FECHA_ENTREGA_LEJANA si se pasa). 0 = sin limite.
    dias-maximos-adelante: 365
  rutas:
    max-pedidos: 4 # maximo de pedidos por ruta
    # Al registrar un pedido para una fecha que ya tiene rutas armadas, se inserta solo en una ruta con espacio de su
    # zona o en una ruta nueva (UltimoMomentoAutomatico).
    ultimo-momento-automatico: true
    # Ventana de tiempo al ordenar las paradas: con 60, una ruta visita primero todas las entregas de 09:00-09:59, luego
    # las de 10:00-10:59, etc. (vecino mas cercano dentro de cada franja). 0 = vecino mas cercano puro.
    ventana-horaria-minutos: 0
    armado:
      programado-habilitado: true # armado automatico con @Scheduled
      cron: "0 0 18 * * *" # todos los dias a las 18:00 (hora de logistica.zona-horaria)
      dias-adelante: 1 # arma rutas del dia siguiente
  seguridad:
    # false: toda la API queda abierta (sin token) mientras la web y el movil terminan el login. El login igual
    # funciona. Para encenderla: SEGURIDAD_HABILITADA=true. Contrato y permisos en docs/api-auth.md.
    habilitada: ${SEGURIDAD_HABILITADA:false}
    jwt:
      # Clave HMAC-SHA256 (minimo 32 caracteres). Este valor es solo para desarrollo: en un despliegue real se pasa
      # por la variable de entorno JWT_SECRETO.
      secreto: ${JWT_SECRETO:dev-logistica-ultima-milla-clave-hs256-solo-desarrollo}
      expiracion-minutos: 720 # 12 horas: una jornada de trabajo
  cors:
    origenes-permitidos:
      - http://localhost:5173 # app web (Vite)
      - http://localhost:*
      - http://127.0.0.1:*
      - http://10.0.2.2:* # emulador Android

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Debe coincidir con swagger-ui.version del pom.xml (override por DOMPurify vulnerable, #43): springdoc 3.2.0 trae
    # fijada la 5.34.0 y, sin esto, busca esos archivos y /swagger-ui/index.html responde 404.
    version: 5.35.1
